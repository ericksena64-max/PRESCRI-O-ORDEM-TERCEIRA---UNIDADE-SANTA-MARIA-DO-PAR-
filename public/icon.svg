<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2850"/>
      <stop offset="50%" stop-color="#0b1e3b"/>
      <stop offset="100%" stop-color="#061224"/>
    </linearGradient>
    <linearGradient id="blueBracket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.2"/>
  
  <!-- Hospital Ordem Terceira 3D Emblem -->
  <g transform="translate(256, 256)" filter="url(#dropShadow)">
    <!-- Top Left L-Bracket -->
    <path d="M -140 -42 L -42 -42 L -42 -140 L -82 -140 L -82 -82 L -140 -82 Z" fill="url(#blueBracket)"/>
    <!-- Top Right L-Bracket -->
    <path d="M 42 -42 L 140 -42 L 140 -82 L 82 -82 L 82 -140 L 42 -140 Z" fill="url(#blueBracket)"/>
    <!-- Bottom Left L-Bracket -->
    <path d="M -140 42 L -42 42 L -42 140 L -82 140 L -82 82 L -140 82 Z" fill="url(#blueBracket)"/>
    <!-- Bottom Right L-Bracket -->
    <path d="M 42 42 L 140 42 L 140 82 L 82 82 L 82 140 L 42 140 Z" fill="url(#blueBracket)"/>
    
    <!-- Central Hospital Cross -->
    <rect x="-26" y="-156" width="52" height="312" rx="16" fill="url(#crossGrad)"/>
    <rect x="-156" y="-26" width="312" height="52" rx="16" fill="url(#crossGrad)"/>
  </g>
</svg>
